[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-clusters"
version = "0.1.0"
description = "Discover installed skills, classify them into task-type clusters, rank by preference, and ask the user to pick before any member runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
skill-clusters = "skill_clusters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
